# Quality gate for every branch and pull request.
#
# Deployments are handled by the Vercel GitHub integration (project "openloop"):
#   - push to main            → production deployment
#   - push to any other branch → preview deployment (URL posted on the PR)
# This workflow only verifies that the code is mergeable; it never deploys.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feature/**", "chore/**", "fix/**"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck & build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
